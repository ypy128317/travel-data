# ============ 旅游数据平台 国内网络友好版部署 ============
# 与 docker-compose.yml 功能一致，仅把镜像构建改为 Dockerfile.cn
# （Python 官方源 + 清华 pip 源，不依赖 ghcr.io，适合国内虚拟机）
#
# 用法（在虚拟机项目目录执行）：
#   docker compose -f docker-compose.cn.yml up -d --build          # 启动
#   docker compose -f docker-compose.cn.yml --profile seed up seeder   # 生成种子数据
#   docker compose -f docker-compose.cn.yml down                   # 停止

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-travel}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/travel.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_PASSWORD:-root} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- 数据初始化（建表后生成种子数据，执行一次） ----------
  seeder:
    build:
      context: .
      dockerfile: Dockerfile.cn
    container_name: travel-seeder
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "${DB_PASSWORD:-root}"
      DB_NAME: "${DB_NAME:-travel}"
      APP_PORT: "8000"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      MODEL_NAME: "${MODEL_NAME:-qwen-flash}"
      TMAP_KEY: "${TMAP_KEY:-}"
    command: sh -c "python -m generate.main --profile smoke || true"
    profiles:
      - seed

  # ---------- FastAPI 后端（API + 可视化页面 + 地图） ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.cn
    container_name: travel-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "${DB_PASSWORD:-root}"
      DB_NAME: "${DB_NAME:-travel}"
      APP_PORT: "8000"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      MODEL_NAME: "${MODEL_NAME:-qwen-flash}"
      TMAP_KEY: "${TMAP_KEY:-}"
    ports:
      - "8000:8000"

volumes:
  mysql_data:
