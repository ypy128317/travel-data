<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云游旅行 · 线路地图</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#f6f8fc;color:#111827;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  header{position:relative;overflow:hidden;background:linear-gradient(112deg,#0d1428,#17224a 62%,#1b2a5e);color:#fff;padding:16px 24px;
    border-bottom:1px solid rgba(255,255,255,.08)}
  header::after{content:"";position:absolute;right:-40px;top:-100px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(56,189,248,.28),transparent 68%);pointer-events:none}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:11px;position:relative;z-index:1}
  header h1::before{content:"";width:4px;height:18px;border-radius:3px;background:linear-gradient(180deg,#a5b4fc,#38bdf8);flex:none}
  header p{margin:5px 0 0;font-size:12px;opacity:.68;position:relative;z-index:1}
  .wrap{max-width:1280px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid #e6e9f2;border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px -10px rgba(16,24,40,.14)}
  .modebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px}
  .tabs{display:inline-flex;background:#f1f3f9;border:1px solid #e6e9f2;border-radius:10px;padding:3px;gap:2px}
  .tabs button{border:0;background:transparent;color:#6b7280;font-size:12.8px;font-weight:600;padding:7px 16px;border-radius:8px;
    cursor:pointer;font-family:inherit;transition:.18s;white-space:nowrap}
  .tabs button:hover{color:#4f46e5}
  .tabs button.active{background:#fff;color:#4f46e5;box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .fields{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11.5px;color:#6b7280;font-weight:600;letter-spacing:.2px}
  select,input{padding:9px 12px;border:1px solid #dfe4ef;border-radius:9px;font-size:13px;background:#fff;color:#111827;outline:none;transition:.18s;font-family:inherit}
  select:hover,input:hover{border-color:#c3cae0}
  select:focus,input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.14)}
  input#spots{min-width:380px}
  button.btn{border:0;border-radius:9px;padding:9px 16px;font-size:12.8px;cursor:pointer;font-weight:600;transition:.18s;font-family:inherit}
  .btn-main{background:linear-gradient(135deg,#5b52ea,#4f46e5);color:#fff;box-shadow:0 8px 18px -8px rgba(79,70,229,.9)}
  .btn-main:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .btn-ghost{background:#eef0ff;color:#4f46e5;border:1px solid #e0e3ff}
  .btn-ghost:hover{background:#e3e6ff}
  .tag{display:inline-block;padding:4px 11px;background:#f4f6fb;color:#4f46e5;border:1px solid #e0e3ff;border-radius:999px;font-size:11.5px;margin:3px;font-weight:500}
  .status{color:#b45309;font-size:12.3px;margin-left:auto}
  .legend{font-size:11.8px;color:#6b7280;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .spots-list{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
  #info h2{font-size:15px;margin:0 0 10px;font-weight:700}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #e0e3ff;border-top-color:#4f46e5;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ===== 行程模式 ===== */
  .plan-head{display:flex;flex-direction:column;gap:9px}
  .plan-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .plan-title .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:#eef0ff;color:#4f46e5;border:1px solid #e0e3ff}
  .plan-title .badge.local{background:#fff7ed;color:#b45309;border-color:#fed7aa}
  .plan-meta{display:flex;flex-wrap:wrap;gap:8px}
  .plan-meta span{font-size:12px;color:#374151;background:#f4f6fb;border:1px solid #e6e9f2;border-radius:8px;padding:5px 11px;font-weight:600}
  .plan-summary{margin:0;font-size:13px;color:#4b5563;line-height:1.6}
  .plan-tips{margin:0;font-size:12.3px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 11px}
  .filter{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .filter button{border:1px solid #e0e3ff;background:#fff;color:#4f46e5;border-radius:999px;padding:5px 13px;font-size:11.8px;
    font-weight:600;cursor:pointer;font-family:inherit;transition:.18s;display:flex;align-items:center;gap:6px}
  .filter button:hover{background:#f4f6fb}
  .filter button.active{color:#fff;border-color:transparent}
  .filter .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .plan-actions{display:flex;gap:8px;margin-top:2px}
  .plan-actions button{border:0;background:#eef0ff;color:#4f46e5;border-radius:8px;padding:7px 13px;font-size:12px;
    font-weight:600;cursor:pointer;font-family:inherit;transition:.18s}
  .plan-actions button:hover{background:#e3e6ff}
  .stage{display:flex;gap:12px;align-items:stretch}
  #map{flex:1;min-width:0;height:520px;border-radius:11px;background:#eef2f7;border:1px solid #e6e9f2;overflow:hidden}
  #timeline{width:290px;flex:none;max-height:520px;overflow-y:auto;padding-right:4px}
  #timeline::-webkit-scrollbar{width:6px}
  #timeline::-webkit-scrollbar-thumb{background:#d7dceb;border-radius:6px}
  .day-card{background:#fff;border:1px solid #e6e9f2;border-radius:11px;padding:12px;margin-bottom:10px;cursor:pointer;
    transition:.18s;border-left:3px solid #e5e7eb}
  .day-card:hover{box-shadow:0 6px 18px -8px rgba(16,24,40,.25);transform:translateY(-1px)}
  .day-card.active{border-left-width:3px;background:#fafbff}
  .day-card h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px}
  .day-card .dnum{width:20px;height:20px;border-radius:6px;color:#fff;font-size:11px;display:inline-flex;
    align-items:center;justify-content:center;font-weight:700;flex:none}
  .slot{font-size:11.6px;color:#4b5563;line-height:1.55;margin:3px 0;display:flex;gap:6px}
  .slot b{color:#6b7280;font-weight:600;flex:none}
  .day-spots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .day-spots .sp{font-size:11px;background:#f4f6fb;border:1px solid #e6e9f2;border-radius:6px;padding:3px 8px;color:#374151}
  .day-rec{font-size:11px;color:#047857;margin-top:7px;border-top:1px dashed #e6e9f2;padding-top:7px;line-height:1.6}
  .legend-item{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#4b5563;background:#f4f6fb;
    border:1px solid #e6e9f2;border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:600}
  .legend-item .bar{width:14px;height:4px;border-radius:3px}
  .empty-plan{text-align:center;padding:36px 16px;color:#6b7280}
  .empty-plan b{display:block;color:#374151;font-size:14px;margin-bottom:6px}
  .iw{font-family:inherit;min-width:150px;max-width:230px;font-size:12px;line-height:1.6}
  .iw .iw-t{font-weight:700;font-size:13px;color:#111827;margin-bottom:4px}
  .iw .iw-d{color:#6b7280;font-size:11px;margin-bottom:5px}
  .iw .iw-s{color:#374151}
  .iw .iw-p{color:#047857;font-weight:600;margin-top:5px}
  .iw .iw-img{width:100%;height:96px;object-fit:cover;border-radius:8px;margin-bottom:7px;display:block}
  .day-card .day-photo{width:100%;height:78px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block}
  .spotThumb{width:20px;height:20px;border-radius:5px;object-fit:cover;vertical-align:-5px;margin-right:5px;border:1px solid #e6e9f2}

  /* ===== 地图升级：播放 / 视角 / 动效 ===== */
  .tool-btn{border:1px solid #e0e3ff;background:#fff;color:#4f46e5;border-radius:9px;padding:7px 12px;font-size:12px;
    font-weight:600;cursor:pointer;font-family:inherit;transition:.18s;white-space:nowrap}
  .tool-btn:hover{background:#eef0ff;transform:translateY(-1px)}
  .tool-btn.playing{background:linear-gradient(135deg,#5b52ea,#4f46e5);color:#fff;border-color:transparent;
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 16px -6px rgba(79,70,229,.9)}50%{box-shadow:0 6px 24px -4px rgba(79,70,229,1)}}
  .day-card.playing{border-color:#4f46e5!important;box-shadow:0 0 0 2px rgba(79,70,229,.22),0 8px 20px -8px rgba(79,70,229,.6);transform:translateY(-2px)}
  .play-progress{height:3px;background:#eef0ff;border-radius:2px;margin-top:9px;overflow:hidden}
  .play-progress i{display:block;height:100%;background:linear-gradient(90deg,#5b52ea,#38bdf8);width:0;transition:width 2.4s linear;border-radius:2px}
  .map-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;
    background:linear-gradient(135deg,#eef0ff,#e0f2fe);color:#4f46e5;border:1px solid #dbe3ff}
  .poi-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed #e6e9f2}
  .poi-bar label{font-size:11.5px;color:#6b7280;font-weight:600;white-space:nowrap}
  .poi-bar input{flex:1;min-width:180px}
  .poi-bar select{min-width:110px}
  .poi-hint{font-size:11px;color:#9ca3af;white-space:nowrap}
  .tool-btn.on{background:#4f46e5;color:#fff;border-color:transparent}
</style>
<!-- 兼容 iframe 沙箱：localStorage/sessionStorage 不可用时提供内存实现 -->
<script type="text/javascript">
(function(){
  function shim(name){
    try{ void window[name]; return; }catch(e){}
    var mem={};
    var s={
      getItem:function(k){return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null;},
      setItem:function(k,v){mem[k]=String(v);},
      removeItem:function(k){delete mem[k];},
      clear:function(){mem={};},
      key:function(i){var ks=Object.keys(mem);return(i>=0&&i<ks.length)?ks[i]:null;}
    };
    Object.defineProperty(s,'length',{get:function(){return Object.keys(mem).length;}});
    try{Object.defineProperty(window,name,{value:s,configurable:true});}catch(e2){}
  }
  shim('localStorage'); shim('sessionStorage');
})();
</script>
<!-- 高德 JS API 2.0 强制要求安全密钥：必须在使用前设置；Key 与安全密钥均由后端从 .env 注入，前端源码不写入真实值 -->

<body>
<header>
  <h1>云游旅行 · 线路地图</h1>
  <p>景点打点连线 · 按天着色的 AI 行程地图 · 3D 视角 · 行程自动播放 · 🚗 小车轨迹回放 · 🛰️ 卫星影像 · 实时路况 · POI 周边搜索 · 高德地图（GCJ-02）· Key 由后端安全注入</p>
</header>
<div class="wrap">
  <div class="card modebar">
    <div class="tabs">
      <button id="tab-free" class="active">自由绘制线路</button>
      <button id="tab-plan">AI 行程地图</button>
    </div>
    <button class="tool-btn" id="view-toggle" title="切换 2D / 3D 地图视角">◩ 3D 视角</button>

    <button class="tool-btn" id="satellite-toggle" title="切换标准地图 / 卫星影像">🛰️ 卫星图</button>

    <span class="map-badge">✦ 智能路线可视化</span>
    <span class="status" id="status"></span>
  </div>

  <!-- 自由绘制控件 -->
  <div class="card" id="free-controls">
    <div class="fields">
      <div class="field"><label>城市</label>
        <select id="city">
          <option value="三亚">三亚</option><option value="云南">云南</option><option value="厦门">厦门</option>
          <option value="张家界">张家界</option><option value="成都">成都</option><option value="杭州">杭州</option>
        </select>
      </div>
      <div class="field"><label>线路景点（逗号分隔，按顺序）</label>
        <input id="spots" value="亚龙湾,蜈支洲岛,天涯海角,南山文化旅游区">
      </div>
      <div class="field"><label>交通方式</label>
        <select id="mode"><option value="drive">驾车</option><option value="walk">步行</option></select>
      </div>
      <button class="btn btn-main" id="draw">绘制线路</button>
      <button class="btn btn-ghost" id="preset">加载该城市景点</button>
    </div>
    <div class="legend" id="free-legend">提示：内置 6 城市景点用真实坐标直接打点；自定义景点走高德地图实时地理编码，越具体越准。</div>
    <div class="poi-bar">
      <label>周边搜索</label>
      <input id="poi-keyword" placeholder="输入关键词，如：餐厅、停车场、酒店" value="餐厅">
      <select id="poi-type"><option value="">全部分类</option><option value="餐饮服务">餐饮</option><option value="住宿服务">酒店</option><option value="停车场">停车场</option><option value="购物中心">购物</option></select>
      <button class="btn btn-ghost" id="poi-search">搜索周边</button>
      <button class="tool-btn" id="poi-clear">清除</button>
      <span class="poi-hint" id="poi-hint">以上一条打点的景点为中心 · 半径 3 km</span>
    </div>
  </div>

  <!-- AI 行程控件 -->
  <div class="card" id="plan-controls" style="display:none">
    <div class="plan-head" id="plan-head">
      <div class="empty-plan"><b>还没有 AI 行程</b>请先在「AI 智能行程助手」生成行程，再点结果里的「在地图上查看完整行程」。<br>
        <button class="btn btn-main" style="margin-top:12px" id="go-ai">去生成 AI 行程 →</button></div>
    </div>
  </div>

  <!-- 地图 + 时间轴（地图容器始终存在，避免隐藏时尺寸为 0） -->
  <div class="card" style="padding:6px">
    <div class="stage">
      <div id="map"></div>
      <aside id="timeline" style="display:none"></aside>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="card" id="info" style="display:none"></div>
</div>
<script>
const PRESETS={

// 坐标为 GCJ-02，高德与腾讯共用同一坐标系，值可直接复用；存储顺序为 [纬度, 经度]
const COORDS={
  '三亚':{'亚龙湾':[18.2149,109.6393],'蜈支洲岛':[18.3077,109.7592],'天涯海角':[18.2470,109.3510],'南山文化旅游区':[18.3010,109.2010],'海棠湾':[18.3000,109.7200],'鹿回头':[18.2200,109.5100],'西岛':[18.2300,109.3700]},
  '云南':{'大理古城':[25.6060,100.1550],'洱海':[25.7500,100.1700],'丽江古城':[26.8720,100.2340],'玉龙雪山':[27.1040,100.1760],'石林':[24.8140,103.3300],'滇池':[25.0400,102.7000],'泸沽湖':[27.7000,100.7700]},
  '厦门':{'鼓浪屿':[24.4470,118.0650],'中山路步行街':[24.4800,118.0890],'沙坡尾':[24.4400,118.0900],'曾厝垵':[24.4300,118.1200],'环岛路':[24.4400,118.1300],'南普陀寺':[24.4400,118.0880]},
  '张家界':{'张家界国家森林公园':[29.3250,110.4500],'天门山':[29.1300,110.4800],'武陵源':[29.3500,110.5500],'袁家界':[29.3400,110.5000],'金鞭溪':[29.3300,110.4800]},
  '成都':{'成都大熊猫繁育研究基地':[30.7400,104.1470],'宽窄巷子':[30.6700,104.0550],'武侯祠':[30.6460,104.0490],'锦里':[30.6460,104.0550],'春熙路':[30.6570,104.0820],'都江堰':[31.0000,103.6200]},
  '杭州':{'西湖':[30.2430,120.1490],'灵隐寺':[30.2400,120.1000],'龙井村':[30.2200,120.1000],'河坊街':[30.2400,120.1700],'西溪湿地':[30.2700,120.0600],'雷峰塔':[30.2310,120.1480]}
};
const DAY_COLORS=['#e11d48','#2563eb','#059669','#d97706','#7c3aed','#0891b2','#db2777'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 高德坐标顺序是 [经度, 纬度]，与腾讯 LatLng(纬,经) 相反：统一在这里转换 */
const LL=(lat,lng)=>new AMap.LngLat(lng,lat);
const pair=p=>[p.lng,p.lat];

/* ===== 精致序号 Marker：SVG data URI 作为高德 Marker 的 content ===== */
function pinSvg(num,color){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="34" height="46" viewBox="0 0 34 46">'+
    '<defs><filter id="s" x="-60%" y="-60%" width="220%" height="220%">'+
    '<feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.35"/></filter></defs>'+
    '<path d="M17 2C8.7 2 2 8.7 2 17c0 11 15 27 15 27s15-16 15-27C32 8.7 25.3 2 17 2z" '+
    'fill="'+color+'" stroke="#fff" stroke-width="2" filter="url(#s)"/>'+
    '<circle cx="17" cy="17" r="10.5" fill="#fff"/>'+
    '<text x="17" y="22" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" '+
    'font-weight="700" fill="'+color+'">'+num+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function pinMarker(num,color,p,name){
  const m=new AMap.Marker({
    position: pair(p),
    content:'<img src="'+pinSvg(num,color)+'" alt="" style="width:34px;height:46px;display:block">',
    offset:new AMap.Pixel(-17,-46),
    title:name||''
  });
  return m;
}
/* 折线配置：实线带箭头，虚线用于「直线兜底」 */
function polyStyle(color,dashed){
  const o={strokeColor:color,strokeWeight:dashed?3:5,borderWeight:1,borderColor:'#fff',lineCap:'round'};
  if(dashed){o.strokeStyle='dashed';}
  else{o.showArrow=true;}
  return o;
}

let map=null, markerLayer=null, lineLayer=null, infoWin=null;
let autoDrawn=false, pendingAction=null;
let is3D=false, playTimer=null, playDays=[], playIdx=0;
let mode='free', currentPlan=null, planPoints=[], planDrawn=false, activeDay=0, lastPlanUid='';

function initMap(){
  if(map)return true;
  if(!window.AMap){$('status').textContent='地图组件加载中…';return false;}
  const box=$('map');
  // 容器宽高为 0（面板 display:none）时不要建图，否则高德地图尺寸异常
  if(!box||box.clientWidth<10||box.clientHeight<10)return false;
  try{
    map=new AMap.Map('map',{zoom:11,center:[120.15,30.25],viewMode:'2D'});
    // 专业地图控件：缩放 + 比例尺
    try{map.addControl(new AMap.ControlBar({position:{right:'14px',bottom:'48px'}}));}catch(e){}
    try{map.addControl(new AMap.Scale({position:'LB'}));}catch(e){}
    $('status').textContent='';
    return true;
  }catch(e){$('status').textContent='地图初始化失败：'+(e.message||e);return false;}
}
// 容器可见性变化后触发布局刷新（高德没有 resize()，用 setZoom 触发重绘兜底）
function mapResize(){try{if(typeof map.resize==='function'){map.resize();}else{map.setZoom(map.getZoom());}}catch(e){}}
// 建图可能要等容器可见，未就绪时把动作挂起，由 ResizeObserver 补执行
function requestDraw(action){
  if(initMap()){
    mapResize();
    setTimeout(action,60);
  }else pendingAction=action;
}
function parseHash(){
  const h=(location.hash||'').replace(/^#/,'');
  if(!h)return false;
  const p=new URLSearchParams(h);
  const city=p.get('city'), spots=p.get('spots');
  if(city&&$('city').querySelector('option[value="'+city+'"]'))$('city').value=city;
  if(spots)$('spots').value=spots;
  return true;
}
function clearLayers(){
  stopCar(); // 重绘前停掉小车动画，避免残留在旧线路上
  [markerLayer,lineLayer].forEach(L=>{
    const arr=Array.isArray(L)?L:[L];
    arr.forEach(x=>{if(x){try{map.remove(x);}catch(e){}}});
  });
  markerLayer=lineLayer=null;
  if(infoWin){try{infoWin.close();}catch(e){}}
}
function setStatus(txt,color){const s=$('status');s.textContent=txt||'';s.style.color=color||'#b45309';}

// 实时路况：高德 2.0 用 TileLayer.Traffic 图层（不是 setTraffic，那是百度的方法）
function toggleTraffic(){
  if(!initMap()){setStatus('地图尚未就绪','#b45309');return;}
  try{
    if(trafficLayer){
      map.remove(trafficLayer);trafficLayer=null;trafficOn=false;
    }else{
      if(typeof AMap.TileLayer==='undefined'||!AMap.TileLayer.Traffic){
        // 老脚本可能没带图层类，动态补载
        setStatus('路况图层加载中…','#4f46e5');
        AMap.plugin(['AMap.TileLayer.Traffic'],function(){toggleTraffic();});
        return;
      }
      trafficLayer=new AMap.TileLayer.Traffic({autoRefresh:true,interval:180});
      map.add(trafficLayer);trafficOn=true;
    }
  }catch(e){setStatus('路况图层失败：'+(e.message||e),'#b45309');return;}
  const b=$('traffic-toggle');
  b.classList.toggle('on',trafficOn);
  b.textContent=trafficOn?'🚦 路况已开':'🚦 实时路况';
  setStatus(trafficOn?'✓ 实时路况已开启（红=拥堵 黄=缓行 绿=畅通）':'已关闭实时路况','#047857');
}

// 卫星影像切换：标准图 / 卫星影像互斥，路网作为叠加层
function toggleSatellite(){
  if(!initMap()){setStatus('地图尚未就绪','#b45309');return;}
  const apply=()=>{
    try{
      if(satelliteOn){
        if(satelliteLayer){map.remove(satelliteLayer);satelliteLayer=null;}
        if(roadNetLayer){map.remove(roadNetLayer);roadNetLayer=null;}
        satelliteOn=false;
      }else{
        satelliteLayer=new AMap.TileLayer.Satellite();
        roadNetLayer=new AMap.TileLayer.RoadNet();
        map.add(satelliteLayer);map.add(roadNetLayer);
        satelliteOn=true;
      }
    }catch(e){setStatus('卫星图切换失败：'+(e.message||e),'#b45309');return;}
    const b=$('satellite-toggle');
    b.classList.toggle('on',satelliteOn);
    b.textContent=satelliteOn?'🛰️ 卫星已开':'🛰️ 卫星图';
    setStatus(satelliteOn?'✓ 已切换卫星影像 + 路网（再点切回标准图）':'已切回标准地图','#047857');
  };
  if(typeof AMap.TileLayer==='undefined'||!AMap.TileLayer.Satellite){
    setStatus('卫星图层加载中…','#4f46e5');
    AMap.plugin(['AMap.TileLayer.Satellite','AMap.TileLayer.RoadNet'],apply);
    return;
  }
  apply();
}

// 收集当前线路的路径点（自由绘制 / AI 行程都支持）
function currentRoutePath(){
  let path=[];
  try{
    const Ls=Array.isArray(lineLayer)?lineLayer:(lineLayer?[lineLayer]:[]);
    Ls.forEach(L=>{const p=L.getPath&&L.getPath();if(p&&p.length)path=path.concat(p);});
  }catch(e){}
  return path;
}
// 小车俯视图标
function carSvg(){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">'+
    '<circle cx="14" cy="14" r="13" fill="#fff" stroke="#4f46e5" stroke-width="2"/>'+
    '<rect x="10" y="8" width="8" height="12" rx="3" fill="#4f46e5"/>'+
    '<circle cx="14" cy="14" r="2.4" fill="#fff"/></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function stopCar(){
  carMoving=false;
  if(carMarker){try{carMarker.stopMove();}catch(e){}try{map.remove(carMarker);}catch(e){}carMarker=null;}
  const b=$('car-toggle');
  if(b){b.classList.remove('on');b.textContent='🚗 轨迹回放';}
}
// 轨迹回放：小车沿当前线路行驶（高德 MoveAnimation 插件）
function replayRoute(){
  if(!initMap()){setStatus('地图尚未就绪','#b45309');return;}
  if(carMoving){stopCar();setStatus('已停止轨迹回放','#6b7280');return;}
  const path=currentRoutePath();
  if(path.length<2){setStatus('请先绘制线路或生成行程，再来回放轨迹','#b45309');return;}
  routePath=path;
  const start=()=>{
    stopCar();
    try{
      carMarker=new AMap.Marker({
        position:path[0],
        content:'<img src="'+carSvg()+'" alt="" style="width:28px;height:28px;display:block">',
        offset:new AMap.Pixel(-14,-14),
        autoRotation:true,
        zIndex:300
      });
      map.add(carMarker);
      const dur=Math.max(2600,path.length*95); // 按点数自适应时长
      carMarker.moveAlong(path,{duration:dur,autoRotation:true,circlable:false});
      carMoving=true;
      const b=$('car-toggle');b.classList.add('on');b.textContent='🚗 停止回放';
      setStatus('🚗 小车沿行程路线出发，演示完整线路…','#4f46e5');
      try{carMarker.on('moveend',()=>{if(carMoving){setStatus('✓ 轨迹回放完成','#047857');stopCar();}});}catch(e){}
    }catch(e){stopCar();setStatus('轨迹回放失败：'+(e.message||e),'#b45309');}
  };
  const proto=window.AMap&&AMap.Marker&&AMap.Marker.prototype;
  if(!proto||typeof proto.moveAlong!=='function'){
    setStatus('动画插件加载中…','#4f46e5');
    AMap.plugin(['AMap.MoveAnimation'],start);
  }else start();
}

// POI 周边搜索：以最后绘制的打卡点为中心，半径 3km
function searchPoi(){
  if(!initMap()){setStatus('请先绘制线路或等待地图就绪','#b45309');return;}
  const kw=($('poi-keyword').value||'').trim();
  if(!kw){setStatus('请输入搜索关键词','#b45309');return;}
  const type=$('poi-type').value;
  // 中心优先用最后一个打卡点，否则用地图中心
  let center=poiCenter||map.getCenter();
  let lng=center.lng!=null?center.lng:(center.lat!=null?center[1]:null);
  let lat=center.lat!=null?center.lat:(center[0]!=null?center[0]:null);
  if(lng==null||lat==null){lng=109.5;lat=18.25;}
  $('poi-hint').textContent='搜索中心 '+lat.toFixed(3)+','+lng.toFixed(3)+' · 半径 3 km';
  clearPoi();
  setStatus('🔍 正在搜索「'+kw+'」周边…','#4f46e5');
  try{
    const ps=new AMap.PlaceSearch({city:'全国',pageSize:20,extensions:'base'});
    const q=(type?type+'|':'')+kw;
    ps.searchNearBy(q,[lng,lat],3000,function(status,result){
      if(status!=='complete'||!result||!result.poiList||!result.poiList.pois||!result.poiList.pois.length){
        setStatus('未找到「'+kw+'」周边结果，换个关键词试试','#b45309');return;
      }
      const pois=result.poiList.pois;
      const ms=pois.map(function(poi){
        const m=new AMap.Marker({position:poi.location,title:poi.name,
          label:{content:'<div style="background:#fff;color:#e11d48;border:1px solid #fecdd3;border-radius:4px;padding:1px 5px;font-size:11px;font-weight:600;white-space:nowrap">'+esc(poi.name)+'</div>',direction:'top'}});
        m.on('click',function(){
          try{
            if(!infoWin)infoWin=new AMap.InfoWindow({content:'',offset:new AMap.Pixel(0,-30)});
            const dist=poi.distance!=null?(' · 距中心约 '+poi.distance+' m'):'';
            infoWin.setContent('<div class="iw"><div class="iw-t">📍 '+esc(poi.name)+'</div><div class="iw-d">'+esc(poi.address||'')+dist+'</div></div>');
            infoWin.open(map,poi.location);
          }catch(e){setStatus('📍 '+poi.name,'#047857');}
        });
        return m;
      });
      poiLayer=ms;
      ms.forEach(function(m){map.add(m);});
      setStatus('✓ 找到 '+ms.length+' 个「'+kw+'」周边结果，点击看详情','#047857');
    });
  }catch(e){setStatus('周边搜索失败：'+(e.message||e),'#b45309');}
}
function clearPoi(){
  if(poiLayer&&poiLayer.length){poiLayer.forEach(function(m){try{map.remove(m);}catch(e){}});}
  poiLayer=null;
  if(infoWin){try{infoWin.close();}catch(e){}}
}

/* ===== 高德服务类 API 是回调式，包装成 Promise 复用原有 async 流程 ===== */
function geocode(address,city){
  return new Promise(resolve=>{
    try{
      const gc=new AMap.Geocoder(city?{city:city}:{});
      gc.getLocation(address,(status,result)=>{
        if(status==='complete'&&result&&result.geocodes&&result.geocodes.length){
          const loc=result.geocodes[0].location;
          resolve({lat:loc.lat,lng:loc.lng});
        }else resolve(null);
      });
    }catch(e){resolve(null);}
  });
}
function fetchRoute(from,to,travel){
  return new Promise(resolve=>{
    try{
      const svc=travel==='walk'?new AMap.Walking({}):new AMap.Driving({policy:AMap.DrivingPolicy.LEAST_TIME});
      svc.get(pair(from),pair(to),(status,result)=>{
        if(status==='complete'&&result&&result.routes&&result.routes[0]){
          const path=[];
          (result.routes[0].steps||[]).forEach(s=>{(s.path||[]).forEach(p=>path.push({lat:p.lat,lng:p.lng}));});
          resolve(path.length?path:null);
        }else resolve(null);
      });
    }catch(e){resolve(null);}
  });
}

/* ==================== 自由绘制模式 ==================== */
async function draw(){
  if(!initMap())return;
  const names=$('spots').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean).slice(0,15);
  if(!names.length){setStatus('请填写至少一个景点');return}
  const city=$('city').value, travel=$('mode').value;
  setStatus('');
  $('status').innerHTML='<span class="spin"></span> 正在定位 '+names.length+' 个景点…';
  const pts=[]; const misses=[]; let builtin=0, geo=0;
  for(const name of names){
    const c=COORDS[city]&&COORDS[city][name];
    if(c){pts.push({name,lat:c[0],lng:c[1]});builtin++;continue;}
    const loc=await geocode(name,city);
    if(loc){pts.push({name,lat:loc.lat,lng:loc.lng});geo++;}
    else misses.push(name);
  }
  if(!pts.length){setStatus('未定位到任何景点，试试内置 6 城市景点或更具体的名称');return}
  clearLayers();
  const markers=pts.map((p,i)=>{
    const m=pinMarker(i+1,'#e11d48',p,p.name);
    m.on('click',()=>setStatus('📍 '+p.name,'#047857'));
    return m;
  });
  map.add(markers);
  markerLayer=markers;
  // 记录最后一个打卡点作为 POI 搜索中心
  poiCenter={lat:pts[pts.length-1].lat,lng:pts[pts.length-1].lng};
  $('poi-hint').textContent='以「'+pts[pts.length-1].name+'」为中心 · 半径 3 km';
  const svcTravel=travel;
  let legs=[]; let realRoute=0;
  for(let i=0;i<pts.length-1;i++){
    const seg=await fetchRoute(pts[i],pts[i+1],svcTravel);
    if(seg&&seg.length){legs=legs.concat(seg);realRoute++;}
    else legs.push({lat:pts[i].lat,lng:pts[i].lng},{lat:pts[i+1].lat,lng:pts[i+1].lng});
  }
  if(legs.length){
    lineLayer=new AMap.Polyline(Object.assign({path:legs.map(pair)},polyStyle(realRoute?'#2563eb':'#7c3aed',!realRoute)));
    map.add(lineLayer);
  }
  fitPoints(pts);
  setStatus('已绘制 '+pts.length+' 个景点（内置坐标 '+builtin+(geo?' / 实时定位 '+geo:'')+'）'+
    (realRoute?' · 实时路线':' · 直线连线')+(misses.length?' · 未找到:'+misses.join('/'):''),'#047857');
  const info=$('info');
  info.style.display='block';
  info.innerHTML='<h2 style="margin-top:0">📍 本次线路（按顺序）</h2><div class="spots-list">'+
    pts.map((p,i)=>'<span class="tag">'+(i+1)+'. '+esc(p.name)+'</span>').join('')+
    (misses.length?'<div class="legend">未定位：'+esc(misses.join('、'))+'</div>':'');
}
function fitPoints(pts){
  if(!pts.length)return;
  try{
    const lngs=pts.map(p=>p.lng),lats=pts.map(p=>p.lat);
    const b=new AMap.Bounds(
      LL(Math.min.apply(null,lats),Math.min.apply(null,lngs)),
      LL(Math.max.apply(null,lats),Math.max.apply(null,lngs))
    );
    map.setBounds(b,false,[70,70,70,70]);
  }catch(e){
    const lats=pts.map(p=>p.lat),lngs=pts.map(p=>p.lng);
    map.setCenter(LL((Math.min.apply(null,lats)+Math.max.apply(null,lats))/2,(Math.min.apply(null,lngs)+Math.max.apply(null,lngs))/2));
    if(pts.length>1)map.setZoom(12);
  }
}

/* ==================== AI 行程地图模式 ==================== */
// 从行程对象里按天提取打卡点。
// 注意：知识库城市在 AI 面板里用占位 areaId，返回的商品可能来自别的城市，
// 因此这类城市优先用「行程文本里提到的真实景点」（COORDS 有精确坐标），
// 商品只在时间轴里展示，不参与打点，避免把外地点画到地图上。
function extractPlanDays(plan){
  const city=(plan.city||'').replace(/[市省]$/,'');
  const preset=PRESETS[city]||[];
  const coordSet=COORDS[city]||null;
  const days=[];
  (plan.days_plan||[]).forEach((dp,i)=>{
    const text=[dp.title,dp.morning,dp.afternoon,dp.evening].filter(Boolean).join(' ');
    const names=[], fromText=[];
    if(coordSet){
      Object.keys(coordSet).forEach(n=>{if(text.indexOf(n)>=0&&names.indexOf(n)<0){names.push(n);fromText.push(n);}});
    }
    (dp.recommendations||[]).forEach(x=>{
      if(!x||!x.name)return;
      let n=String(x.name).split(/[-－—（(]/)[0].trim();
      if(!n||names.indexOf(n)>=0)return;
      if(coordSet){if(coordSet[n])names.push(n);}   // 知识库城市只收能精确打点的
      else names.push(n);                            // 商品城市：用商品名走地理编码
    });
    // 不足 2 个点时用城市代表景点按天轮转兜底（标记为建议打卡，气泡里不带当天文案以免文不对题）
    for(let k=0;names.length<2&&preset.length;k++){
      const n=preset[(i*2+k)%preset.length];
      if(names.indexOf(n)<0)names.push(n);
    }
    days.push({
      day:dp.day||(i+1), title:dp.title||('第'+(i+1)+'天'),
      morning:dp.morning||'', afternoon:dp.afternoon||'', evening:dp.evening||'',
      recommendations:dp.recommendations||[], names:names.slice(0,4),
      textNames:fromText.slice(0,4),
      color:DAY_COLORS[i%DAY_COLORS.length]
    });
  });
  return days;
}

    renderPlanLayers();
  });
  $('timeline').querySelectorAll('.day-card').forEach(c=>c.onclick=()=>{
    const d=+c.dataset.day;
    const btn=$('day-filter').querySelector('button[data-day="'+d+'"]');if(btn)btn.click();
  });
  $('back-ai').onclick=()=>{try{parent.postMessage({type:'goto-ai'},'*');}catch(e){}};
  $('re-draw').onclick=()=>{stopPlay();planPoints=[];planDrawn=false;requestDraw(drawPlan);};
  $('play-tour').onclick=togglePlay;
  $('timeline').style.display='';
  // 图例
  $('legend').innerHTML='<span style="color:#6b7280;font-weight:600">按天着色：</span>'+
    days.map((d,i)=>'<span class="legend-item" data-day="'+(i+1)+'"><span class="bar" style="background:'+d.color+'"></span>第 '+d.day+' 天</span>').join('')+
    (plan.references&&plan.references.length?'<span style="color:#9ca3af;margin-left:6px">📚 参考 '+esc(plan.references.length)+' 篇攻略</span>':'');
  $('legend').querySelectorAll('.legend-item').forEach(x=>x.onclick=()=>{
    const btn=$('day-filter').querySelector('button[data-day="'+x.dataset.day+'"]');if(btn)btn.click();
  });
}
async function drawPlan(){
  if(!initMap()||!currentPlan)return;
  const days=extractPlanDays(currentPlan);
  if(!days.length){setStatus('这份行程没有可绘制的日程');return}
  if(!planPoints.length){
    setStatus('');$('status').innerHTML='<span class="spin"></span> 正在定位行程中的打卡点…';
    const city=(currentPlan.city||'').replace(/[市省]$/,'');
    for(let i=0;i<days.length;i++){
      for(let k=0;k<days[i].names.length;k++){
        const name=days[i].names[k];
        const c=COORDS[city]&&COORDS[city][name];
        let pos=null;
        if(c)pos={lat:c[0],lng:c[1]};
        else{
          const loc=await geocode(name,city||undefined);
          if(loc)pos={lat:loc.lat,lng:loc.lng};
        }
        if(pos)planPoints.push({dayIdx:i,k,name,lat:pos.lat,lng:pos.lng,color:days[i].color,title:days[i].title,day:days[i].day,
          fromText:(days[i].textNames||[]).indexOf(name)>=0});
      }
    }
  }
  if(!planPoints.length){setStatus('未能定位到行程中的景点，试试切换到「自由绘制」用城市代表景点', '#b45309');return}
  renderPlanLayers();
  planDrawn=true;
  setStatus('已按 '+days.length+' 天着色绘制 '+planPoints.length+' 个打卡点 · 点击圆点看详情','#047857');
  $('info').style.display='block';
  $('info').innerHTML='<h2 style="margin-top:0">📋 行程打卡点</h2><div class="spots-list">'+
    planPoints.map((p,i)=>'<span class="tag" style="border-color:'+p.color+'33;color:'+p.color+'">D'+p.day+' · '+esc(p.name)+'</span>').join('')+
    (currentPlan.references&&currentPlan.references.length?'<div class="legend">📚 引用攻略：'+currentPlan.references.map(x=>esc(x)).join('、')+'</div>':'');
}
function showMarkerInfo(p){
  if(!p)return;
  const d=extractPlanDays(currentPlan)[p.dayIdx]||{};
  const recs=(d.recommendations||[]).filter(x=>x&&x.name);
  let slot='', hint='';
  if(p.fromText){
    slot=p.k===0?(d.morning||d.afternoon||''):(p.k===1?(d.afternoon||d.evening||''):(d.evening||''));
  }else{
    hint='<div class="iw-s" style="color:#9ca3af">建议打卡点（当天行程未点名具体景点）</div>';
  }
  var pphoto='';try{if(parent&&parent.spotPhoto)pphoto=parent.spotPhoto(p.name,(currentPlan&&currentPlan.city)||'','scenic')||'';}catch(e){}
  const html='<div class="iw">'+(pphoto?'<img class="iw-img" src="'+pphoto+'" alt="">':'')+'<div class="iw-t">'+esc(p.name)+'</div>'+
    '<div class="iw-d">第 '+p.day+' 天 · '+esc(p.title)+'</div>'+
    (slot?'<div class="iw-s">'+esc(slot)+'</div>':hint)+
    (p.fromText&&recs.length?'<div class="iw-p">🛒 '+recs.slice(0,2).map(x=>esc(x.name)+(x.price!=null?' ¥'+Number(x.price).toFixed(0):'')).join(' · ')+'</div>':'')+'</div>';
  try{
    if(!infoWin)infoWin=new AMap.InfoWindow({content:'',offset:new AMap.Pixel(0,-34)});
    infoWin.setContent(html);
    infoWin.open(map,LL(p.lat,p.lng));
  }catch(e){setStatus('📍 第'+p.day+'天 · '+p.name+(slot?' — '+slot:''),'#047857');}
}
function renderPlanLayers(){
  if(!initMap())return;
  clearLayers();
  const shown=activeDay?planPoints.filter(p=>p.dayIdx===activeDay-1):planPoints;
  if(!shown.length){setStatus('这一天没有可显示的打卡点');return}
  const byDay={};
  shown.forEach(p=>{(byDay[p.dayIdx]=byDay[p.dayIdx]||[]).push(p);});
  // 每个点一个带当日序号的独立 marker（SVG 序号水滴）
  const markers=shown.map(p=>{
    const c=DAY_COLORS[p.dayIdx%DAY_COLORS.length];
    const m=pinMarker(p.k+1,c,p,p.name);
    m.on('click',()=>showMarkerInfo(p));
    return m;
  });
  map.add(markers);
  markerLayer=markers;
  // 每天一条折线
  const lines=[];
  Object.keys(byDay).forEach(k=>{
    const arr=byDay[k];
    if(arr.length>1)lines.push(new AMap.Polyline(Object.assign({path:arr.map(pair)},polyStyle(DAY_COLORS[k%DAY_COLORS.length],false))));
  });
  if(lines.length){map.add(lines);lineLayer=lines;}
  fitPoints(shown);
}
function receivePlan(plan){
  if(!plan||!plan.days_plan)return;
  stopPlay();
  const uid=plan._uid||JSON.stringify([plan.city,plan.days,plan.summary,plan.estimated_cost]);
  if(uid===lastPlanUid&&mode==='plan')return;   // 同一份行程不重复地理编码
  lastPlanUid=uid;
  currentPlan=plan;planPoints=[];planDrawn=false;activeDay=0;
  const days=extractPlanDays(plan);
  buildPlanUI(plan,days);
  setMode('plan');
}

/* ==================== 视角 / 行程自动播放（演示亮点） ==================== */
function toggle3D(){
  if(!initMap()||!map)return;
  is3D=!is3D;
  try{
    if(is3D){map.setViewMode('3D');map.setPitch(52);map.setRotation(-18);}
    else{map.setViewMode('2D');map.setPitch(0);map.setRotation(0);}
    $('view-toggle').textContent=is3D?'◧ 2D 平面':'◩ 3D 视角';
    $('view-toggle').style.background=is3D?'#4f46e5':'#fff';
    $('view-toggle').style.color=is3D?'#fff':'#4f46e5';
  }catch(e){is3D=!is3D;setStatus('当前地图不支持 3D 视角','#b45309');}
}
// 把某一天设为聚焦（复用筛选按钮的逻辑），并高亮时间轴卡片
function focusDay(n){
  activeDay=n;
  const btn=$('day-filter')&&$('day-filter').querySelector('button[data-day="'+n+'"]');
  if(btn)btn.click();   // click 内部会调 renderPlanLayers 并 fitBounds
  $('timeline').querySelectorAll('.day-card').forEach(c=>c.classList.toggle('playing',n>0&&+c.dataset.day===n));
  const card=n>0&&$('timeline').querySelector('.day-card[data-day="'+n+'"]');
  if(card)try{card.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}
}
function stopPlay(){
  if(playTimer){clearInterval(playTimer);playTimer=null;}
  const b=$('play-tour');
  if(b){b.textContent='▶ 自动播放行程';b.classList.remove('playing');b.style.background='#eef0ff';b.style.color='#4f46e5';}
  const bar=$('play-bar');if(bar)bar.style.width='0%';
  $('timeline').querySelectorAll('.day-card').forEach(c=>c.classList.remove('playing'));
}
function togglePlay(){
  if(playTimer){stopPlay();return;}
  if(!currentPlan||!planPoints.length){setStatus('请先生成 AI 行程并等待地图绘制完成','#b45309');return;}
  const days=extractPlanDays(currentPlan);
  if(!days.length)return;
  const b=$('play-tour');b.textContent='❚❚ 停止播放';b.classList.add('playing');
  b.style.background='linear-gradient(135deg,#5b52ea,#4f46e5)';b.style.color='#fff';
  playIdx=0;
  const total=days.length;
  const step=()=>{
    playIdx++;
    if(playIdx>total){stopPlay();focusDay(0);setStatus('✓ 行程演示完毕','#047857');return;}
    focusDay(playIdx);
    const bar=$('play-bar');if(bar)bar.style.width=(playIdx/total*100)+'%';
    setStatus('▶ 自动演示 第 '+playIdx+'/'+total+' 天','#4f46e5');
  };
  step();
  playTimer=setInterval(step,2400);
}

/* ==================== 事件绑定 ==================== */
$('tab-free').onclick=()=>{stopPlay();setMode('free');};
$('tab-plan').onclick=()=>setMode('plan');
$('view-toggle').onclick=toggle3D;
$('traffic-toggle').onclick=toggleTraffic;
$('satellite-toggle').onclick=toggleSatellite;
$('car-toggle').onclick=replayRoute;
$('poi-search').onclick=searchPoi;
$('poi-clear').onclick=()=>{clearPoi();setStatus('已清除周边搜索结果','#6b7280');};
$('poi-keyword').onkeydown=(e)=>{if(e.key==='Enter')searchPoi();};
$('draw').onclick=()=>{autoDrawn=true;initMap();draw();};
$('preset').onclick=()=>{$('spots').value=(PRESETS[$('city').value]||[]).join(',');setMode('free');autoDrawn=false;requestDraw(()=>{autoDrawn=true;draw();});};
$('city').onchange=()=>{$('spots').value=(PRESETS[$('city').value]||[]).join(',');autoDrawn=false;requestDraw(()=>{autoDrawn=true;draw();});};
$('go-ai').onclick=()=>{try{parent.postMessage({type:'goto-ai'},'*');}catch(e){}};
// 首次加载：读 hash 参数，容器可见后自动画自由线路
window.addEventListener('load',()=>{
  parseHash();
  requestDraw(()=>{if(!autoDrawn){autoDrawn=true;draw();}});
  try{parent.postMessage({type:'map-ready'},'*');}catch(e){}
});
// 容器尺寸从 0 变为可见时（面板 display:none→block）自动补建图
if(window.ResizeObserver){
  try{new ResizeObserver(()=>{
    if(!map){
      if(initMap()&&pendingAction){const a=pendingAction;pendingAction=null;mapResize();setTimeout(a,60);}
    }else{mapResize();}
  }).observe($('map'));}catch(e){}
}
// 接收父页面消息
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='ai-plan'){receivePlan(d.plan);}
  else if(d.type==='map-show'){
    mapResize();
    if(mode==='plan'&&currentPlan&&!planDrawn)requestDraw(drawPlan);
    else if(mode==='free'&&!autoDrawn)requestDraw(()=>{autoDrawn=true;draw();});
  }
});
</script>
