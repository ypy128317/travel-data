# ============================================================
# 旅游数据平台 · 云服务器 CI/CD 自动部署工作流
# 触发：push 到 main（或 GitHub 页面手动 Run workflow）
# 执行：服务器 self-hosted runner（标签 self-hosted + aliyun）
# 流程：拉代码 → 同步前端挂载卷 → 重建后端 → 线上验证
# ============================================================

name: Deploy travel-data to Aliyun Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署任务，避免并发改同一目录
concurrency:
  group: travel-data-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, aliyun]

    steps:
      - name: 1. 拉取最新代码
        run: |
          set -e
          export HOME=/root
          # Runner 以 systemd 服务运行，环境里未必有 HOME，不能依赖 git config --global。
          # 用 -c 直接注入 safe.directory，规避 Git 2.35+ 的 dubious ownership
          # （部署目录属主是 Windows 传入的 UID，系统里没有对应用户）。
          # Runner 会为 actions/checkout 注入 GIT_CONFIG_* 凭据，公开仓库匿名 fetch 用不到，
          # 残留的 extraheader 反而可能让 fetch 认证失败，先清掉。
          for v in $(env | grep '^GIT_CONFIG_' | cut -d= -f1); do unset "$v"; done
          GIT="git -c safe.directory=/opt/travel-data"
          cd /opt/travel-data || { echo "::error::部署目录不存在"; exit 1; }
          # 自举：服务器重装后也能自动重建 git 工作区
          [ -d .git ] || $GIT init -q
          $GIT remote get-url origin >/dev/null 2>&1 || \
            $GIT remote add origin https://github.com/ypy128317/travel-data.git
          if ! FETCH_OUT=$($GIT fetch origin main 2>&1); then
            echo "::error::git fetch 失败: $(echo "$FETCH_OUT" | tr '\n' ' ')"
            echo "::error::git 版本: $(git --version 2>&1)"
            echo "::error::remote: $($GIT remote -v 2>&1 | head -2 | tr '\n' ' ')"
            echo "::error::GitHub 连通: $(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://github.com 2>&1)"
            exit 1
          fi
          # 强制对齐远端版本；不用 git clean，避免误删 .env / kb_data / static
          $GIT reset --hard origin/main || { echo "::error::git reset 失败"; exit 1; }
          $GIT log -1 --oneline
          echo "=== 运行时关键文件保护检查 ==="
          test -f .env     || { echo "::error::.env 丢失，停止部署"; exit 1; }
          test -d kb_data  || { echo "::error::kb_data 丢失，停止部署"; exit 1; }
          test -d static   || { echo "::error::static 挂载卷丢失，停止部署"; exit 1; }
          $GIT branch --set-upstream-to=origin/main main 2>/dev/null || true

      - name: 2. 同步前端到静态挂载卷
        run: |
          set -e
          # static 是 compose 挂载到容器 /app/app/static 的卷，覆盖后刷新浏览器即生效
          cp -a /opt/travel-data/app/static/. /opt/travel-data/static/
          echo "=== 静态目录 ==="
          ls -l /opt/travel-data/static/

      - name: 3. 校验配置并重建后端
        run: |
          set -e
          cd /opt/travel-data
          docker compose -f docker-compose.cloud.yml config -q
          # 代码未变化时 Docker 命中缓存，不会重启容器；有变化才重建
          docker compose -f docker-compose.cloud.yml up -d --build backend

      - name: 4. 线上健康检查
        run: |
          set -e
          sleep 8
          echo "=== 容器状态 ==="
          docker ps --format '{{.Names}}  {{.Status}}'
          echo "=== 接口验证 ==="
          curl -fsS -o /dev/null -w '首页      HTTP %{http_code}\n' http://127.0.0.1/
          curl -fsS -o /dev/null -w '前端 JS   HTTP %{http_code}\n' http://127.0.0.1/app.js
          curl -fsS -o /dev/null -w '地图页    HTTP %{http_code}\n' http://127.0.0.1/map
          curl -fsS -o /dev/null -w '城市接口  HTTP %{http_code}\n' http://127.0.0.1/api/meta/cities
          curl -fsS -o /dev/null -w '销售工作台 HTTP %{http_code}\n' http://127.0.0.1/sales
          echo "=== 部署完成：http://101.37.234.52 ==="
